name: Checks

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: mat142-ai-tutor/webapp

jobs:
  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mat142-ai-tutor/webapp/package-lock.json
      - run: npm ci
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mat142-ai-tutor/webapp/package-lock.json
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:verify
      - if: always()
        run: npx supabase stop --no-backup
